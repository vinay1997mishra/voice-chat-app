plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.anamika.ai'
    compileSdk 36

    def signingPath = System.getenv("ANAMIKA_KEYSTORE_PATH")
    def signingStorePassword = System.getenv("ANAMIKA_KEYSTORE_PASSWORD")
    def signingAlias = System.getenv("ANAMIKA_KEY_ALIAS")
    def signingKeyPassword = System.getenv("ANAMIKA_KEY_PASSWORD")
    def hasOwnerSigning = signingPath && signingStorePassword && signingAlias && signingKeyPassword

    signingConfigs {
        if (hasOwnerSigning) {
            ownerRelease {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    defaultConfig {
        applicationId 'com.anamika.ai'
        minSdk 26
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("ANAMIKA_VERSION_CODE") ?: "130000")
        versionName System.getenv("ANAMIKA_VERSION_NAME") ?: "13.0.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    androidResources {
        noCompress.add("gguf")
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/*.so']
        }
        resources {
            pickFirsts += ['kotlin/**/*.kotlin_builtins', 'kotlin/*.kotlin_builtins']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("ANAMIKA_KEYSTORE_PATH") != null &&
                    !System.getenv("ANAMIKA_KEYSTORE_PATH").trim().isEmpty()) {
                signingConfig signingConfigs.ownerRelease
            }
        }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.eclipse.jdt:ecj:3.46.100'
    implementation 'org.mozilla:rhino:1.9.1'
    implementation 'org.webjars.npm:typescript:5.9.3'
    implementation 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.2.21'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    implementation 'io.xberg.tslp.android:tree-sitter-language-pack-android:1.15.12'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython("python3.13")
        pyc { src = false }
    }
}

// Anamika 13 keeps an immutable source snapshot inside the APK so the local
// self-upgrade engine can create isolated candidates without GitHub/server access.
def anamikaSelfSourceDir = layout.buildDirectory.dir("generated/anamikaSelfSource")
tasks.register("bundleAnamikaSelfSource", Sync) {
    into(anamikaSelfSourceDir)
    from("src/main/java") { into("self_source/app/src/main/java") }
    from("src/main/kotlin") { into("self_source/app/src/main/kotlin") }
    from("src/main/res") { into("self_source/app/src/main/res") }
    from("src/main/assets") { into("self_source/app/src/main/assets"); exclude("**/*.gguf") }
    from("src/main/AndroidManifest.xml") { into("self_source/app/src/main"); rename { "AndroidManifest.xml" } }
    from("build.gradle") { into("self_source/app"); rename { "build.gradle" } }
    from(rootProject.file("build.gradle")) { into("self_source"); rename { "build.gradle" } }
    from(rootProject.file("settings.gradle")) { into("self_source"); rename { "settings.gradle" } }
    from(rootProject.file("gradle.properties")) { into("self_source"); rename { "gradle.properties" } }
    from(rootProject.file("tools")) { into("self_source/tools") }
}
android.sourceSets.main.assets.srcDir(anamikaSelfSourceDir.get().asFile)
tasks.named("preBuild").configure { dependsOn("bundleAnamikaSelfSource") }
