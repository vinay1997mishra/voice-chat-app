name: Verify Anamika Universal Code

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Relative repository path containing Anamika-generated code
        required: true
        default: generated/anamika-project

permissions:
  contents: read

jobs:
  universal-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: LTS

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install native compiler/interpreter set
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang ruby php-cli
          rustup toolchain install stable --profile minimal
          rustup default stable
          npm install --global typescript@5.9.3
          clang --version
          clang++ --version
          rustc --version
          go version
          dotnet --version
          ruby --version
          php --version
          dart --version
          tsc --version

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"

      - name: Validate requested path
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          case "$PROJECT_PATH" in
            /*|*".."*) echo "Unsafe project path"; exit 2;;
          esac
          test -d "$PROJECT_PATH"
          realpath "$PROJECT_PATH"

      - name: Android Gradle build
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            gradle --no-daemon assembleDebug
          else
            echo "No Android Gradle project."
          fi

      - name: Web and TypeScript build
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
            npm test --if-present
            npm run typecheck --if-present
          else
            while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
            mapfile -d '' tsfiles < <(find . -type f -name '*.ts' -print0)
            if [ "${#tsfiles[@]}" -gt 0 ]; then tsc --noEmit --skipLibCheck "${tsfiles[@]}"; fi
          fi

      - name: Python compile
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          python3 -m compileall -q "$PROJECT_PATH"

      - name: C and C++ compile syntax
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do clang -fsyntax-only "$f"; done < <(find "$PROJECT_PATH" -type f -name '*.c' -print0)
          while IFS= read -r -d '' f; do clang++ -std=c++17 -fsyntax-only "$f"; done < <(find "$PROJECT_PATH" -type f \( -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) -print0)

      - name: Rust compile
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -f Cargo.toml ]; then
            cargo check --all-targets
          else
            while IFS= read -r -d '' f; do
              rustc --edition 2021 --crate-type lib --emit metadata "$f" -o /tmp/anamika-rust.rmeta
            done < <(find . -type f -name '*.rs' -print0)
          fi

      - name: Go compile
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -f go.mod ]; then
            go test ./...
          else
            while IFS= read -r -d '' dir; do
              (cd "$dir" && GO111MODULE=off go test)
            done < <(find . -type f -name '*.go' -printf '%h\0' | sort -zu)
          fi

      - name: C sharp build
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          mapfile -t projects < <(find . -type f \( -name '*.sln' -o -name '*.csproj' \) | sort)
          for p in "${projects[@]}"; do dotnet build "$p" --nologo; done
          if [ "${#projects[@]}" -eq 0 ] && find . -type f -name '*.cs' -print -quit | grep -q .; then
            echo "Standalone C# files found without a project; local Tree-sitter syntax diagnostics remain authoritative until a csproj is generated."
          fi

      - name: Ruby syntax
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do ruby -c "$f"; done < <(find "$PROJECT_PATH" -type f -name '*.rb' -print0)

      - name: PHP syntax
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do php -l "$f"; done < <(find "$PROJECT_PATH" -type f -name '*.php' -print0)

      - name: Dart analyze
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"
          if [ -f pubspec.yaml ]; then
            dart pub get
            dart analyze --fatal-infos
          else
            while IFS= read -r -d '' f; do dart analyze "$f"; done < <(find . -type f -name '*.dart' -print0)
          fi

      - name: Shell syntax
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do bash -n "$f"; done < <(find "$PROJECT_PATH" -type f -name '*.sh' -print0)

      - name: Verification complete
        run: echo "All detected source types passed their configured real compiler/interpreter checks."
