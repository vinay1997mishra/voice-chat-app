name: Tinni Star Android

on:
  push:
    branches: [tinnistar]
    paths:
      - 'apps/tinni_star/**'
      - '.github/workflows/tinni-star-build.yml'
  pull_request:
    branches: [tinnistar]
    paths:
      - 'apps/tinni_star/**'
      - '.github/workflows/tinni-star-build.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

concurrency:
  group: tinni-star-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Check and install the verified cinematic catalog
        id: cinematic
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ ! -f tools/cinematic/bundle-lock.json ]; then
            if [ -n "$PINNED_SOURCE_SHA" ]; then
              echo "Expected cinematic bundle pin is missing."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "App checks continue; APK packaging waits for the verified cinematic bundle." >> "$GITHUB_STEP_SUMMARY"
          else
            tag="$(python3 -c "import json; print(json.load(open('tools/cinematic/bundle-lock.json'))['release_tag'])")"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern cinematic-assets.zip --dir /tmp/tinni-cinematic-bundle
            # Validate the released media against its immutable generation source.
            # App transport fixes must not regenerate or silently replace this bundle.
            media_source="$(python3 -c "import json; print(json.load(open('tools/cinematic/bundle-lock.json'))['source_commit'])")"
            git fetch --depth=1 origin "$media_source"
            media_verify="$RUNNER_TEMP/tinni-pinned-media-source"
            mkdir -p "$media_verify"
            git archive "$media_source" tools/cinematic | tar -x -C "$media_verify"
            python3 "$media_verify/tools/cinematic/catalog.py" install \
              --archive /tmp/tinni-cinematic-bundle/cinematic-assets.zip \
              --lock "$GITHUB_WORKSPACE/tools/cinematic/bundle-lock.json" \
              --destination "$GITHUB_WORKSPACE/apps/tinni_star/assets/cinematic"
            python3 tools/cinematic/catalog.py validate
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject embedded release secrets
        shell: bash
        run: |
          set -euo pipefail
          leaked_keys="$(find apps/tinni_star -type f \( -name '*.keystore' -o -name '*.jks' -o -name '*.p12' -o -name '*.pfx' \) -print)"
          if [ -n "$leaked_keys" ]; then
            echo "::error::Release signing material must never be committed to the app tree."
            printf '%s\n' "$leaked_keys"
            exit 1
          fi
          if grep -RInE --exclude-dir=build --exclude='*.lock'             'BEGIN [A-Z ]*PRIVATE KEY|LIVEKIT_API_SECRET|SESSION_SECRET|OWNER_PASSWORD|CLOUDFLARE_API_TOKEN|RESEND_API_KEY|FACEBOOK_APP_SECRET'             apps/tinni_star; then
            echo "::error::Server-side secret material or secret variable names were found in the Android app tree."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform shell
        working-directory: apps/tinni_star
        run: flutter create . --platforms=android --org com.tinnistar

      - name: Configure Tinni Star Android
        id: signing
        working-directory: apps/tinni_star
        env:
          TINNI_RELEASE_KEYSTORE_B64: ${{ secrets.TINNI_RELEASE_KEYSTORE_B64 }}
          TINNI_RELEASE_STORE_PASSWORD: ${{ secrets.TINNI_RELEASE_STORE_PASSWORD }}
          TINNI_RELEASE_KEY_PASSWORD: ${{ secrets.TINNI_RELEASE_KEY_PASSWORD }}
          TINNI_RELEASE_KEY_ALIAS: ${{ secrets.TINNI_RELEASE_KEY_ALIAS }}
          TINNI_RELEASE_CERT_SHA256: ${{ secrets.TINNI_RELEASE_CERT_SHA256 }}
        run: |
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode tool/tinni_star_icon.webp.b64 > android/app/src/main/res/drawable-nodpi/tinni_star_icon.webp
          mkdir -p android/app/src/main/kotlin/com/tinnistar/tinni_star
          cp tool/MainActivity.kt android/app/src/main/kotlin/com/tinnistar/tinni_star/MainActivity.kt
          cp tool/TinniRoomForegroundService.kt android/app/src/main/kotlin/com/tinnistar/tinni_star/TinniRoomForegroundService.kt
          missing=0
          for name in             TINNI_RELEASE_KEYSTORE_B64             TINNI_RELEASE_STORE_PASSWORD             TINNI_RELEASE_KEY_PASSWORD             TINNI_RELEASE_KEY_ALIAS             TINNI_RELEASE_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::Missing secure signing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/tinnistar" ]; then
              echo "::error::Secure release signing is required on tinnistar. The old committed debug key is retired."
              exit 1
            fi
          else
            printf '%s' "$TINNI_RELEASE_KEYSTORE_B64" | base64 --decode > android/app/tinni-release.keystore
            chmod 600 android/app/tinni-release.keystore
            python3 - <<'PY'
          import os
          from pathlib import Path
          def esc(value: str) -> str:
              return (value.replace('\\', '\\\\')
                           .replace('=', '\\=')
                           .replace(':', '\\:')
                           .replace(' ', '\\ '))
          props = {
              'storePassword': os.environ['TINNI_RELEASE_STORE_PASSWORD'],
              'keyPassword': os.environ['TINNI_RELEASE_KEY_PASSWORD'],
              'keyAlias': os.environ['TINNI_RELEASE_KEY_ALIAS'],
              'storeFile': 'tinni-release.keystore',
          }
          Path('android/key.properties').write_text(
              ''.join(f"{k}={esc(v)}\n" for k, v in props.items())
          )
          PY
            actual="$(
              keytool -list -v                 -keystore android/app/tinni-release.keystore                 -storepass "$TINNI_RELEASE_STORE_PASSWORD"                 -alias "$TINNI_RELEASE_KEY_ALIAS" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
            )"
            expected="$(printf '%s' "$TINNI_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test -n "$actual" && test "$actual" = "$expected"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('plugins {', 'import java.util.Properties\nimport java.io.FileInputStream\n\nplugins {', 1)
          marker = 'android {'
          setup = '''val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\n'''
          s = s.replace(marker, setup + marker, 1)
          s = s.replace('buildTypes {\n        release {', '''signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n    buildTypes {\n        release {''', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          s += '\ndependencies {\n    implementation("com.google.android.gms:play-services-auth:21.3.0")\n}\n'
          p.write_text(s)
          PY

      - name: Verify Android signing fingerprint
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/tinni_star
        env:
          TINNI_RELEASE_STORE_PASSWORD: ${{ secrets.TINNI_RELEASE_STORE_PASSWORD }}
          TINNI_RELEASE_KEY_ALIAS: ${{ secrets.TINNI_RELEASE_KEY_ALIAS }}
        run: |
          keytool -list -v             -keystore android/app/tinni-release.keystore             -storepass "$TINNI_RELEASE_STORE_PASSWORD"             -alias "$TINNI_RELEASE_KEY_ALIAS" |
            grep -E 'SHA1:|SHA256:'

      - name: Get packages
        working-directory: apps/tinni_star
        run: flutter pub get

      - name: Patch PAG 1.0.7 for Flutter v2 Android embedding
        working-directory: apps/tinni_star
        run: |
          PAG_GRADLE="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/build.gradle' -print -quit)"
          PAG_JAVA="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/src/main/java/com/example/flutter_pag_plugin/FlutterPagPlugin.java' -print -quit)"
          PAG_MANIFEST="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/src/main/AndroidManifest.xml' -print -quit)"
          test -n "$PAG_GRADLE" && test -n "$PAG_JAVA" && test -n "$PAG_MANIFEST"
          sed -i -E 's/[[:space:]]+package="[^"]+"//' "$PAG_MANIFEST"
          sed -i 's/jcenter()/mavenCentral()/g' "$PAG_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g; s/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' "$PAG_GRADLE"
          grep -q "namespace 'org.libpag.pag'" "$PAG_GRADLE" || sed -i "0,/android {/s//android {\\n    namespace 'org.libpag.pag'/" "$PAG_GRADLE"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$PAG_GRADLE"
          sed -i "s/jvmTarget = ['\"]1.8['\"]/jvmTarget = '17'/g" "$PAG_GRADLE"
          grep -q 'sourceCompatibility JavaVersion.VERSION_17' "$PAG_GRADLE" || sed -i "/android {/a\\    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" "$PAG_GRADLE"
          grep -q "jvmTarget = '17'" "$PAG_GRADLE" || sed -i "/android {/a\\    kotlinOptions { jvmTarget = '17' }" "$PAG_GRADLE"
          python3 - "$PAG_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()
          out = []
          skipping = False
          depth = 0
          for line in lines:
              stripped = line.strip()
              if 'import io.flutter.view.FlutterNativeView;' in line:
                  continue
              if 'PluginRegistry.Registrar registrar;' in line and not stripped.startswith('public'):
                  continue
              legacy_method = (
                  (stripped.startswith('public FlutterPagPlugin(') and 'PluginRegistry.Registrar' in line) or
                  (stripped.startswith('public static void registerWith(') and 'PluginRegistry.Registrar' in line)
              )
              if legacy_method:
                  skipping = True
                  depth = line.count('{') - line.count('}')
                  continue
              if skipping:
                  depth += line.count('{') - line.count('}')
                  if depth <= 0:
                      skipping = False
                  continue
              out.append(line)
          s = '\n'.join(out) + '\n'
          start = s.find('            if (registrar != null) {')
          end_marker = '            } else if (flutterAssets != null) {'
          end = s.find(end_marker, start)
          if start >= 0 and end >= 0:
              s = s[:start] + '            if (flutterAssets != null) {' + s[end + len(end_marker):]
          forbidden = ('FlutterNativeView', 'PluginRegistry.Registrar', 'ViewDestroyListener', 'registrar.')
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit('PAG legacy API remains: ' + ', '.join(leftovers))
          p.write_text(s)
          PY

      - name: Verify Tinni backend syntax
        run: |
          node --check apps/tinni_worker/src/index.js
          node --check apps/tinni_worker/src/app_directory.js

      - name: Setup Node for complete backend checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify owner panel and Worker actions
        working-directory: apps/tinni_worker
        run: |
          npm install --no-audit --no-fund
          npm test
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
          node --check ../tinni_owner_panel/app.js
          node --check ../tinni_owner_panel/login.js

      - name: Analyze
        working-directory: apps/tinni_star
        run: flutter analyze

      - name: Test
        working-directory: apps/tinni_star
        run: timeout --signal=TERM --kill-after=10s 600s flutter test --reporter expanded --timeout 45s --fail-fast

      - name: Upload game layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Tinni-Casino-Game-Previews
          path: apps/tinni_star/build/game_previews/*.png
          if-no-files-found: ignore

      - name: Publish Lucky effect review frames
        if: success()
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -d apps/tinni_star/build/lucky_previews ]; then
            mkdir -p tools/lucky/previews
            cp apps/tinni_star/build/lucky_previews/*.png tools/lucky/previews/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f tools/lucky/previews
            tree="$(git write-tree)"
            commit="$(git commit-tree "$tree" -p "$SOURCE_SHA" -m "Lucky HUD and multiplier effect review frames")"
            branch="lucky-preview-${SOURCE_SHA:0:12}"
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin "$commit:refs/heads/$branch"
            fi
            echo "Lucky previews: https://github.com/$GITHUB_REPOSITORY/tree/$branch/tools/lucky/previews" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish all named gift effect review sheets
        if: success() && steps.cinematic.outputs.ready == 'true'
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          test -f apps/tinni_star/build/gift_previews/all-gifts-0.png
          test -f apps/tinni_star/build/gift_previews/all-gifts-1.png
          git reset --mixed "$SOURCE_SHA"
          mkdir -p tools/gifts/previews
          cp apps/tinni_star/build/gift_previews/*.png tools/gifts/previews/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/gifts/previews
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -p "$SOURCE_SHA" -m "All named gift atmosphere review sheets")"
          branch="gift-preview-${SOURCE_SHA:0:12}"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin "$commit:refs/heads/$branch"
          fi
          echo "Gift previews: https://github.com/$GITHUB_REPOSITORY/tree/$branch/tools/gifts/previews" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live Tinni backend before packaging
        shell: bash
        run: |
          set -euo pipefail
          base="https://tinni-star-api.mishrajii7991.workers.dev"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "$base/health"
          echo

          # Do not block APK packaging only for Cloudflare's exhausted free-tier
          # Durable Object row-write allowance. This is an account quota state,
          # not an Android/app-code failure. Every other deep-health failure
          # remains a hard release blocker.
          set +e
          deep_body="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "$base/health/deep")"
          deep_status="$?"
          set -e
          printf '%s\n' "$deep_body"
          if [ "$deep_status" -ne 0 ]; then
            exit "$deep_status"
          fi
          if python3 - "$deep_body" <<'PY'
          import json, sys
          raw = sys.argv[1]
          try:
              data = json.loads(raw)
          except Exception:
              raise SystemExit(2)
          if data.get("ok") is True:
              raise SystemExit(0)
          detail = str(data.get("detail") or "")
          if "Exceeded allowed rows written in Durable Objects free tier." in detail:
              print("::warning::Cloudflare Durable Object row-write quota is exhausted; APK packaging continues because app/backend tests passed and this quota resets/upgrades independently.")
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          then
            :
          else
            echo "::error::Live deep health failed for a non-quota reason."
            exit 1
          fi

      - name: Verify live app provider configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 "https://tinni-star-api.mishrajii7991.workers.dev/app-config" -o /tmp/tinni-app-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("/tmp/tinni-app-config.json").read_text())
          assert config.get("ok") is True, "App configuration failed"
          readiness = {
              "google": bool(config.get("google_server_client_id")),
              "facebook": bool(config.get("facebook_configured")),
              "email_otp": bool(config.get("email_otp_configured")),
              "livekit": bool(config.get("livekit_configured")),
              "media_storage": bool(config.get("effect_media_configured")),
              "image_moderation": bool(config.get("image_moderation_configured")),
          }
          print("Provider configuration readiness: " + json.dumps(readiness))
          Path("/tmp/tinni-app-readiness.json").write_text(json.dumps(readiness, indent=2))
          PY

      - name: Build installable APK
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        working-directory: apps/tinni_star
        run: flutter build apk --release --split-per-abi

      - name: Verify built APK signing certificate
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        working-directory: apps/tinni_star
        env:
          TINNI_RELEASE_CERT_SHA256: ${{ secrets.TINNI_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/tinni-apk-certs.txt
          python3 ../../tools/signing/verify_apk_certificate.py /tmp/tinni-apk-certs.txt

      - name: Upload Tinni Star ARM64 APK
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Tinni-Star-ARM64
          path: apps/tinni_star/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Tinni Star split APKs
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Tinni-Star-Split-APKs
          path: apps/tinni_star/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - name: Build separate Tinni Star Final APK
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        working-directory: apps/tinni_star
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          old = 'applicationId = "com.tinnistar.tinni_star"'
          assert old in text, "Unexpected Android application ID"
          gradle.write_text(text.replace(old, 'applicationId = "com.tinnistar.tinni_star.finalapp"'))
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text().replace('android:label="Tinni Star"', 'android:label="Tinni Star Final"')
          text = text.replace('android:name=".MainActivity"', 'android:name="com.tinnistar.tinni_star.MainActivity"')
          text = text.replace('android:name=".TinniRoomForegroundService"', 'android:name="com.tinnistar.tinni_star.TinniRoomForegroundService"')
          manifest.write_text(text)
          PY
          flutter build apk --release --split-per-abi --dart-define=TINNI_APP_NAME="Tinni Star Final"
          mkdir -p build/final-apks
          cp build/app/outputs/flutter-apk/app-*-release.apk build/final-apks/

      - name: Verify separate APK identity and signing
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        working-directory: apps/tinni_star
        env:
          TINNI_RELEASE_CERT_SHA256: ${{ secrets.TINNI_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="build/final-apks/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/tinni-final-apk-certs.txt
          python3 ../../tools/signing/verify_apk_certificate.py /tmp/tinni-final-apk-certs.txt
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.tinnistar.tinni_star.finalapp'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Tinni Star Final'"

      - name: Upload one Tinni Star Final ARM64 APK
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Tinni-Star-Final-ARM64
          path: apps/tinni_star/build/final-apks/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload separate Tinni Star Final APKs
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Tinni-Star-Final-Separate-APKs
          path: apps/tinni_star/build/final-apks/*.apk
          if-no-files-found: error

      - name: Upload provider readiness report
        if: steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Tinni-Star-Final-Provider-Readiness
          path: /tmp/tinni-app-readiness.json
          if-no-files-found: error

      - name: Publish direct signed APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/tinnistar' && steps.cinematic.outputs.ready == 'true' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' apps/tinni_star/pubspec.yaml)"
          tag="tinnistar-final-${version//+/-}"
          file="Tinni-Star-Final-${version//+/-}-arm64.apk"
          cp apps/tinni_star/build/final-apks/app-arm64-v8a-release.apk "/tmp/$file"
          printf '%s\n' 'Fresh signed ARM64 installation of Tinni Star Final with CP and VS.' 'This release uses a new signing certificate. If Android reports a signature conflict with an older Tinni Star Final installation, uninstall that old package before installing this APK.' 'Built from the tinnistar branch after backend tests, Flutter analysis/tests, live health and package/signature verification.' > /tmp/tinni-release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "/tmp/$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "/tmp/$file" --repo "$GITHUB_REPOSITORY" --target "$APK_SOURCE_SHA" --title "Tinni Star Final $version" --notes-file /tmp/tinni-release-notes.md
          fi
