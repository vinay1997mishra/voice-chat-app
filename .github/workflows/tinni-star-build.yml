name: Tinni Star Android

on:
  push:
    branches: [tinnistar]
    paths:
      - 'apps/tinni_star/**'
      - '.github/workflows/tinni-star-build.yml'
  pull_request:
    branches: [tinnistar]
    paths:
      - 'apps/tinni_star/**'
      - '.github/workflows/tinni-star-build.yml'
  workflow_dispatch:

concurrency:
  group: tinni-star-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform shell
        working-directory: apps/tinni_star
        run: flutter create . --platforms=android --org com.tinnistar

      - name: Configure Tinni Star Android
        working-directory: apps/tinni_star
        run: |
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode tool/tinni_star_icon.webp.b64 > android/app/src/main/res/drawable-nodpi/tinni_star_icon.webp
          mkdir -p android/app/src/main/kotlin/com/tinnistar/tinni_star
          cp tool/MainActivity.kt android/app/src/main/kotlin/com/tinnistar/tinni_star/MainActivity.kt
          cp tool/TinniRoomForegroundService.kt android/app/src/main/kotlin/com/tinnistar/tinni_star/TinniRoomForegroundService.kt
          mkdir -p "$HOME/.android"
          cp tool/tinni-dev-debug.keystore "$HOME/.android/debug.keystore"
          cp tool/tinni-dev-debug.keystore android/app/tinni-release.keystore
          cat >> android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=tinni-release.keystore
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('plugins {', 'import java.util.Properties\nimport java.io.FileInputStream\n\nplugins {', 1)
          marker = 'android {'
          setup = '''val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\n'''
          s = s.replace(marker, setup + marker, 1)
          s = s.replace('buildTypes {\n        release {', '''signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n    buildTypes {\n        release {''', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY

      - name: Verify Android signing fingerprint
        working-directory: apps/tinni_star
        run: |
          keytool -list -v -keystore tool/tinni-dev-debug.keystore -storepass android | grep -E 'SHA1:|SHA256:'

      - name: Get packages
        working-directory: apps/tinni_star
        run: flutter pub get

      - name: Patch PAG 1.0.7 for Flutter v2 Android embedding
        working-directory: apps/tinni_star
        run: |
          PAG_GRADLE="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/build.gradle' -print -quit)"
          PAG_JAVA="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/src/main/java/com/example/flutter_pag_plugin/FlutterPagPlugin.java' -print -quit)"
          PAG_MANIFEST="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/src/main/AndroidManifest.xml' -print -quit)"
          test -n "$PAG_GRADLE" && test -n "$PAG_JAVA" && test -n "$PAG_MANIFEST"
          sed -i -E 's/[[:space:]]+package="[^"]+"//' "$PAG_MANIFEST"
          sed -i 's/jcenter()/mavenCentral()/g' "$PAG_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g; s/compileSdk[[:space:]]+[0-9]+/compileSdk 36/g' "$PAG_GRADLE"
          grep -q "namespace 'org.libpag.pag'" "$PAG_GRADLE" || sed -i "0,/android {/s//android {\\n    namespace 'org.libpag.pag'/" "$PAG_GRADLE"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$PAG_GRADLE"
          sed -i "s/jvmTarget = ['\"]1.8['\"]/jvmTarget = '17'/g" "$PAG_GRADLE"
          grep -q 'sourceCompatibility JavaVersion.VERSION_17' "$PAG_GRADLE" || sed -i "/android {/a\\    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" "$PAG_GRADLE"
          grep -q "jvmTarget = '17'" "$PAG_GRADLE" || sed -i "/android {/a\\    kotlinOptions { jvmTarget = '17' }" "$PAG_GRADLE"
          python3 - "$PAG_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()
          out = []
          skipping = False
          depth = 0
          for line in lines:
              stripped = line.strip()
              if 'import io.flutter.view.FlutterNativeView;' in line:
                  continue
              if 'PluginRegistry.Registrar registrar;' in line and not stripped.startswith('public'):
                  continue
              legacy_method = (
                  (stripped.startswith('public FlutterPagPlugin(') and 'PluginRegistry.Registrar' in line) or
                  (stripped.startswith('public static void registerWith(') and 'PluginRegistry.Registrar' in line)
              )
              if legacy_method:
                  skipping = True
                  depth = line.count('{') - line.count('}')
                  continue
              if skipping:
                  depth += line.count('{') - line.count('}')
                  if depth <= 0:
                      skipping = False
                  continue
              out.append(line)
          s = '\n'.join(out) + '\n'
          start = s.find('            if (registrar != null) {')
          end_marker = '            } else if (flutterAssets != null) {'
          end = s.find(end_marker, start)
          if start >= 0 and end >= 0:
              s = s[:start] + '            if (flutterAssets != null) {' + s[end + len(end_marker):]
          forbidden = ('FlutterNativeView', 'PluginRegistry.Registrar', 'ViewDestroyListener', 'registrar.')
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit('PAG legacy API remains: ' + ', '.join(leftovers))
          p.write_text(s)
          PY

      - name: Verify Tinni backend syntax
        run: |
          node --check apps/tinni_worker/src/index.js
          node --check apps/tinni_worker/src/app_directory.js

      - name: Setup Node for complete backend checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify owner panel and Worker actions
        working-directory: apps/tinni_worker
        run: |
          npm install --no-audit --no-fund
          npm test
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
          node --check ../tinni_owner_panel/app.js
          node --check ../tinni_owner_panel/login.js

      - name: Analyze
        working-directory: apps/tinni_star
        run: flutter analyze

      - name: Test
        working-directory: apps/tinni_star
        run: timeout --signal=TERM --kill-after=10s 600s flutter test --reporter expanded --timeout 45s --fail-fast

      - name: Upload game layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tinni-Casino-Game-Previews
          path: apps/tinni_star/build/game_previews/*.png
          if-no-files-found: ignore

      - name: Verify live Tinni backend before packaging
        shell: bash
        run: |
          set -euo pipefail
          base="https://tinni-star-api.mishrajii7991.workers.dev"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "$base/health"
          echo
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 "$base/health/deep"
          echo

      - name: Verify live app provider configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 "https://tinni-star-api.mishrajii7991.workers.dev/app-config" -o /tmp/tinni-app-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("/tmp/tinni-app-config.json").read_text())
          assert config.get("ok") is True, "App configuration failed"
          readiness = {
              "google": bool(config.get("google_server_client_id")),
              "facebook": bool(config.get("facebook_configured")),
              "email_otp": bool(config.get("email_otp_configured")),
              "livekit": bool(config.get("livekit_configured")),
              "media_storage": bool(config.get("effect_media_configured")),
              "image_moderation": bool(config.get("image_moderation_configured")),
          }
          print("Provider configuration readiness: " + json.dumps(readiness))
          Path("/tmp/tinni-app-readiness.json").write_text(json.dumps(readiness, indent=2))
          PY

      - name: Build installable APK
        working-directory: apps/tinni_star
        run: flutter build apk --release --split-per-abi

      - name: Verify built APK signing certificate
        working-directory: apps/tinni_star
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -F "8f6be8da2c2509bf2a248f72b81391e6b05e860e"

      - name: Upload Tinni Star ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinni-Star-ARM64
          path: apps/tinni_star/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Tinni Star split APKs
        uses: actions/upload-artifact@v4
        with:
          name: Tinni-Star-Split-APKs
          path: apps/tinni_star/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - name: Build separate Tinni Star Final APK
        working-directory: apps/tinni_star
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          old = 'applicationId = "com.tinnistar.tinni_star"'
          assert old in text, "Unexpected Android application ID"
          gradle.write_text(text.replace(old, 'applicationId = "com.tinnistar.tinni_star.finalapp"'))
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text().replace('android:label="Tinni Star"', 'android:label="Tinni Star Final"')
          text = text.replace('android:name=".MainActivity"', 'android:name="com.tinnistar.tinni_star.MainActivity"')
          text = text.replace('android:name=".TinniRoomForegroundService"', 'android:name="com.tinnistar.tinni_star.TinniRoomForegroundService"')
          manifest.write_text(text)
          PY
          flutter build apk --release --split-per-abi --dart-define=TINNI_APP_NAME="Tinni Star Final"
          mkdir -p build/final-apks
          cp build/app/outputs/flutter-apk/app-*-release.apk build/final-apks/

      - name: Verify separate APK identity and signing
        working-directory: apps/tinni_star
        run: |
          APK="build/final-apks/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.tinnistar.tinni_star.finalapp'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'Tinni Star Final'"

      - name: Upload separate Tinni Star Final APKs
        uses: actions/upload-artifact@v4
        with:
          name: Tinni-Star-Final-Separate-APKs
          path: apps/tinni_star/build/final-apks/*.apk
          if-no-files-found: error

      - name: Upload provider readiness report
        uses: actions/upload-artifact@v4
        with:
          name: Tinni-Star-Final-Provider-Readiness
          path: /tmp/tinni-app-readiness.json
          if-no-files-found: error
