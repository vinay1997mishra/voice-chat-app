name: Tinni Star Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/tinni_star/**'
      - '.github/workflows/tinni-star-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/tinni_star/**'
      - '.github/workflows/tinni-star-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform shell
        working-directory: apps/tinni_star
        run: flutter create . --platforms=android --org com.tinnistar

      - name: Configure Tinni Star Android
        working-directory: apps/tinni_star
        run: |
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode tool/tinni_star_icon.webp.b64 > android/app/src/main/res/drawable-nodpi/tinni_star_icon.webp
          mkdir -p android/app/src/main/kotlin/com/tinnistar/tinni_star
          cp tool/MainActivity.kt android/app/src/main/kotlin/com/tinnistar/tinni_star/MainActivity.kt
          cp tool/TinniRoomForegroundService.kt android/app/src/main/kotlin/com/tinnistar/tinni_star/TinniRoomForegroundService.kt
          mkdir -p "$HOME/.android"
          cp tool/tinni-dev-debug.keystore "$HOME/.android/debug.keystore"
          cp tool/tinni-dev-debug.keystore android/app/tinni-release.keystore
          cat >> android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=tinni-release.keystore
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('plugins {', 'import java.util.Properties\nimport java.io.FileInputStream\n\nplugins {', 1)
          marker = 'android {'
          setup = '''val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\n'''
          s = s.replace(marker, setup + marker, 1)
          s = s.replace('buildTypes {\n        release {', '''signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n    buildTypes {\n        release {''', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY

      - name: Verify Android signing fingerprint
        working-directory: apps/tinni_star
        run: |
          keytool -list -v -keystore tool/tinni-dev-debug.keystore -storepass android | grep -E 'SHA1:|SHA256:'

      - name: Get packages
        working-directory: apps/tinni_star
        run: flutter pub get

      - name: Patch PAG 1.0.7 for Flutter v2 Android embedding
        working-directory: apps/tinni_star
        run: |
          PAG_GRADLE="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/build.gradle' -print -quit)"
          PAG_JAVA="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/src/main/java/com/example/flutter_pag_plugin/FlutterPagPlugin.java' -print -quit)"
          PAG_MANIFEST="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/pag-1.0.7/android/src/main/AndroidManifest.xml' -print -quit)"
          test -n "$PAG_GRADLE" && test -n "$PAG_JAVA" && test -n "$PAG_MANIFEST"
          sed -i -E 's/[[:space:]]+package="[^"]+"//' "$PAG_MANIFEST"
          sed -i 's/jcenter()/mavenCentral()/g' "$PAG_GRADLE"
          grep -q "namespace 'org.libpag.pag'" "$PAG_GRADLE" || sed -i "0,/android {/s//android {\\n    namespace 'org.libpag.pag'/" "$PAG_GRADLE"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$PAG_GRADLE"
          sed -i "s/jvmTarget = ['\"]1.8['\"]/jvmTarget = '17'/g" "$PAG_GRADLE"
          grep -q 'sourceCompatibility JavaVersion.VERSION_17' "$PAG_GRADLE" || sed -i "/android {/a\\    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" "$PAG_GRADLE"
          grep -q "jvmTarget = '17'" "$PAG_GRADLE" || sed -i "/android {/a\\    kotlinOptions { jvmTarget = '17' }" "$PAG_GRADLE"
          python3 - "$PAG_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()
          out = []
          skipping = False
          depth = 0
          for line in lines:
              stripped = line.strip()
              if 'import io.flutter.view.FlutterNativeView;' in line:
                  continue
              if 'PluginRegistry.Registrar registrar;' in line and not stripped.startswith('public'):
                  continue
              legacy_method = (
                  (stripped.startswith('public FlutterPagPlugin(') and 'PluginRegistry.Registrar' in line) or
                  (stripped.startswith('public static void registerWith(') and 'PluginRegistry.Registrar' in line)
              )
              if legacy_method:
                  skipping = True
                  depth = line.count('{') - line.count('}')
                  continue
              if skipping:
                  depth += line.count('{') - line.count('}')
                  if depth <= 0:
                      skipping = False
                  continue
              out.append(line)
          s = '\n'.join(out) + '\n'
          start = s.find('            if (registrar != null) {')
          end_marker = '            } else if (flutterAssets != null) {'
          end = s.find(end_marker, start)
          if start >= 0 and end >= 0:
              s = s[:start] + '            if (flutterAssets != null) {' + s[end + len(end_marker):]
          forbidden = ('FlutterNativeView', 'PluginRegistry.Registrar', 'ViewDestroyListener', 'registrar.')
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit('PAG legacy API remains: ' + ', '.join(leftovers))
          p.write_text(s)
          PY

      - name: Analyze
        working-directory: apps/tinni_star
        run: flutter analyze

      - name: Test
        working-directory: apps/tinni_star
        run: flutter test

      - name: Build installable APK
        working-directory: apps/tinni_star
        run: flutter build apk --release --split-per-abi

      - name: Verify built APK signing certificate
        working-directory: apps/tinni_star
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -F "8f6be8da2c2509bf2a248f72b81391e6b05e860e"

      - name: Upload Tinni Star ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinni-Star-ARM64
          path: apps/tinni_star/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Tinni Star split APKs
        uses: actions/upload-artifact@v4
        with:
          name: Tinni-Star-Split-APKs
          path: apps/tinni_star/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
