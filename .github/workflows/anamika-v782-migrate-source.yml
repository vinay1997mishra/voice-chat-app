name: Migrate Anamika Source to GitHub Tree

on:
  push:
    branches: [ anamika-v7.8.2-final ]
    paths:
      - '.github/workflows/anamika-v782-migrate-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: anamika-v7.8.2-final
          fetch-depth: 0

      - name: Decode source payload
        run: |
          set -euo pipefail
          test -f anamika_build/source.b64
          base64 -d anamika_build/source.b64 > "$RUNNER_TEMP/anamika-source.zip"
          rm -rf "$RUNNER_TEMP/anamika-source"
          mkdir -p "$RUNNER_TEMP/anamika-source"
          unzip -q "$RUNNER_TEMP/anamika-source.zip" -d "$RUNNER_TEMP/anamika-source"
          SRC="$RUNNER_TEMP/anamika-source/AnamikaAI_V7_8_2_Final"
          test -d "$SRC/app/src/main"
          cp -a "$SRC/." ./

      - name: Apply permanent audited fixes
        run: |
          set -euo pipefail
          TEST_LAB="app/src/main/java/com/anamika/ai/TestLabActivity.java"
          AUDIT="tools/validate_audit.py"
          test -f "$TEST_LAB"
          test -f "$AUDIT"
          sed -i 's/OwnerSession\.isValid(/OwnerSession.isActive(/g' "$TEST_LAB"
          sed -i 's/OwnerSession\.isValid/OwnerSession.isActive/g' "$AUDIT"
          ! grep -Fq 'OwnerSession.isValid(' "$TEST_LAB"
          grep -Fq 'OwnerSession.isActive(' "$TEST_LAB"
          grep -Fq 'OwnerSession.isActive' "$AUDIT"

      - name: Switch CI to direct GitHub source
        run: |
          cat > .github/workflows/anamika-v782-build.yml <<'YAML'
          name: Build Anamika V7.8.2 Direct Source

          on:
            push:
              branches: [ anamika-v7.8.2-final ]
              paths:
                - 'app/**'
                - 'tools/**'
                - 'build.gradle'
                - 'settings.gradle'
                - 'gradle.properties'
                - '.github/workflows/anamika-v782-build.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 90
              env:
                MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/38f6bab61d341b23a6c00226f32c0d6148bf9f43/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true
                MODEL_SHA256: cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046
                MODEL_PATH: app/src/main/assets/models/anamika-coder.gguf

              steps:
                - uses: actions/checkout@v5

                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Install Android SDK 36
                  run: |
                    SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
                    SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
                    if [ ! -x "$SDKMANAGER" ]; then
                      SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
                    fi
                    test -n "$SDKMANAGER"
                    test -x "$SDKMANAGER"
                    yes | "$SDKMANAGER" --licenses >/dev/null || true
                    "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
                    echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"

                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '9.6.1'

                - name: Validate direct source
                  run: |
                    python3 tools/validate_source.py
                    python3 tools/validate_v78.py
                    python3 tools/validate_audit.py

                - name: Build lite debug APK
                  run: gradle --no-daemon :app:assembleDebug

                - name: Preserve lite APK
                  run: |
                    mkdir -p artifacts/lite
                    cp app/build/outputs/apk/debug/app-debug.apk artifacts/lite/AnamikaAI-V7.8.2-Lite-debug.apk
                    sha256sum artifacts/lite/*.apk > artifacts/LITE-SHA256SUMS.txt

                - uses: actions/upload-artifact@v4
                  with:
                    name: AnamikaAI-V7.8.2-direct-source-lite
                    compression-level: 0
                    path: |
                      artifacts/lite/
                      artifacts/LITE-SHA256SUMS.txt

                - name: Bundle verified local coding model
                  run: |
                    mkdir -p "$(dirname "$MODEL_PATH")"
                    curl -L --fail --retry 4 --retry-delay 5 "$MODEL_URL" -o "$MODEL_PATH"
                    echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
                    test "$(stat -c%s "$MODEL_PATH")" -gt 900000000

                - name: Build full APK from direct source
                  run: gradle --no-daemon :app:assembleDebug

                - name: Preserve full APK
                  run: |
                    mkdir -p artifacts/full
                    cp app/build/outputs/apk/debug/app-debug.apk artifacts/full/AnamikaAI-V7.8.2-DirectSource-FullLocalAI-debug.apk
                    sha256sum artifacts/lite/*.apk artifacts/full/*.apk > artifacts/SHA256SUMS.txt

                - uses: actions/upload-artifact@v4
                  with:
                    name: AnamikaAI-V7.8.2-direct-source-final
                    compression-level: 0
                    path: artifacts/
          YAML
          sed -i 's/^          //' .github/workflows/anamika-v782-build.yml

      - name: Validate migrated source before commit
        run: |
          set -euo pipefail
          python3 tools/validate_source.py
          python3 tools/validate_v78.py
          python3 tools/validate_audit.py
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/anamika/ai/MainActivity.java
          test -f app/src/main/kotlin/com/anamika/ai/KotlinLlamaRunner.kt
          test -f app/src/main/res/layout/activity_main.xml
          test -f app/build.gradle

      - name: Remove encoded-source dependency
        run: |
          rm -rf anamika_build

      - name: Commit normal Android Studio source tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Migrate Anamika V7.8.2 to direct GitHub source tree"
          git push origin HEAD:anamika-v7.8.2-final
