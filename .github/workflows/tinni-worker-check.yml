name: Tinni Worker Check

on:
  push:
    branches: [tinnistar]
    paths:
      - 'apps/tinni_worker/**'
      - 'apps/tinni_owner_panel/**'
      - '.github/workflows/tinni-worker-check.yml'
      - 'tools/signing/**'
  pull_request:
    branches: [tinnistar]
    paths:
      - 'apps/tinni_worker/**'
      - 'apps/tinni_owner_panel/**'
      - '.github/workflows/tinni-worker-check.yml'
      - 'tools/signing/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for release signing tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify fresh release signing setup
        run: python3 -m unittest discover -s tools/signing -p 'test_*.py' -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: apps/tinni_worker
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check apps/tinni_worker/src/cold_storage.js
          node --check apps/tinni_worker/tool/prepare_private_storage.mjs
          node --check apps/tinni_worker/src/index.js
          node --check apps/tinni_worker/src/app_directory.js
          node --check apps/tinni_worker/src/room_presence.js
          node --check apps/tinni_worker/src/fruit_game.js
          node --check apps/tinni_owner_panel/app.js

      - name: Run Worker tests
        working-directory: apps/tinni_worker
        run: npm test

      - name: Bundle Worker
        working-directory: apps/tinni_worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
