name: Build Android v0.5 APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/main_v05.dart'
      - 'apps/mobile/test/v05_test.dart'
      - 'apps/mobile/pubspec.yaml'
      - '.github/workflows/android-v05-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v05-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create fresh Android runner project
        run: |
          flutter create --platforms=android --org com.voicechatfresh.v05 --project-name voice_chat_app /tmp/voice_chat_v05
          rm -rf /tmp/voice_chat_v05/lib /tmp/voice_chat_v05/test
          cp -R apps/mobile/lib /tmp/voice_chat_v05/lib
          cp -R apps/mobile/test /tmp/voice_chat_v05/test
          cp apps/mobile/pubspec.yaml /tmp/voice_chat_v05/pubspec.yaml
      - name: Get dependencies
        working-directory: /tmp/voice_chat_v05
        run: flutter pub get
      - name: Analyze v0.5
        working-directory: /tmp/voice_chat_v05
        run: flutter analyze lib/main_v05.dart --no-fatal-infos
      - name: Test v0.5
        working-directory: /tmp/voice_chat_v05
        run: flutter test test/v05_test.dart
      - name: Build fresh installable v0.5 release APK
        working-directory: /tmp/voice_chat_v05
        run: flutter build apk --release -t lib/main_v05.dart
      - name: Upload v0.5 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-chat-v0.5-fresh-apk
          path: /tmp/voice_chat_v05/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
