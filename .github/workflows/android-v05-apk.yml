name: Build Android v0.5 APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/main_v05.dart'
      - 'apps/mobile/test/v05_test.dart'
      - 'apps/mobile/pubspec.yaml'
      - '.github/workflows/android-v05-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v05-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android 6+ compatible runner
        run: |
          flutter create --platforms=android --org com.voicechat.compat.v05 --project-name voice_chat_app /tmp/voice_chat_v05
          rm -rf /tmp/voice_chat_v05/lib /tmp/voice_chat_v05/test
          cp -R apps/mobile/lib /tmp/voice_chat_v05/lib
          cp -R apps/mobile/test /tmp/voice_chat_v05/test
          cp apps/mobile/pubspec.yaml /tmp/voice_chat_v05/pubspec.yaml

          if [ -f /tmp/voice_chat_v05/android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' /tmp/voice_chat_v05/android/app/build.gradle.kts
          fi
          if [ -f /tmp/voice_chat_v05/android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' /tmp/voice_chat_v05/android/app/build.gradle
          fi

      - name: Get dependencies
        working-directory: /tmp/voice_chat_v05
        run: flutter pub get

      - name: Analyze v0.5
        working-directory: /tmp/voice_chat_v05
        run: flutter analyze lib/main_v05.dart --no-fatal-infos

      - name: Test v0.5
        working-directory: /tmp/voice_chat_v05
        run: flutter test test/v05_test.dart

      - name: Build universal Android 6+ debug APK
        working-directory: /tmp/voice_chat_v05
        run: flutter build apk --debug -t lib/main_v05.dart

      - name: Build Android 6+ ABI APKs
        working-directory: /tmp/voice_chat_v05
        run: flutter build apk --debug --split-per-abi -t lib/main_v05.dart

      - name: Verify APK signing and SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -1d "$SDK_ROOT"/build-tools/* | sort -V | tail -1)
          APK=/tmp/voice_chat_v05/build/app/outputs/flutter-apk/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:"

      - name: Upload v0.5 Android 6+ APKs
        uses: actions/upload-artifact@v4
        with:
          name: voice-chat-v0.5-android6-plus-apks
          path: |
            /tmp/voice_chat_v05/build/app/outputs/flutter-apk/app-debug.apk
            /tmp/voice_chat_v05/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            /tmp/voice_chat_v05/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            /tmp/voice_chat_v05/build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14
