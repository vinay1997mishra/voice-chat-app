name: Migrate Anamika Source Files

on:
  push:
    branches: [ anamika-v7.8.2-final ]
    paths:
      - '.github/workflows/anamika-v782-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: anamika-v7.8.2-final
          fetch-depth: 0

      - name: Decode complete Anamika source
        run: |
          set -euo pipefail
          test -f anamika_build/source.b64
          rm -rf "$RUNNER_TEMP/anamika-src"
          mkdir -p "$RUNNER_TEMP/anamika-src"
          base64 -d anamika_build/source.b64 > "$RUNNER_TEMP/anamika.zip"
          unzip -q "$RUNNER_TEMP/anamika.zip" -d "$RUNNER_TEMP/anamika-src"
          SRC="$RUNNER_TEMP/anamika-src/AnamikaAI_V7_8_2_Final"
          test -d "$SRC/app/src/main"
          cp -a "$SRC/app" ./
          cp -a "$SRC/tools" ./
          cp -a "$SRC/build.gradle" ./
          cp -a "$SRC/settings.gradle" ./
          cp -a "$SRC/gradle.properties" ./
          mkdir -p .github/workflows
          cp -a "$SRC/.github/workflows/build-apk.yml" .github/workflows/build-apk.yml
          test -f .github/workflows/build-apk.yml
          for f in README.md CINEMATIC_ENGINE.md FULL_TOOLCHAIN_STATUS.md MODEL_BUILD.md PLUGIN_SYSTEM.md STANDALONE_ARCHITECTURE.md V7_6_ULTIMATE_FEATURES.md V7_8_2_FINAL_FOCUS.md V7_8_EVERGREEN_FEATURES.md VALIDATION_REPORT.txt; do
            if [ -f "$SRC/$f" ]; then cp -a "$SRC/$f" ./; fi
          done

      - name: Apply permanent known fixes
        run: |
          set -euo pipefail
          TEST_LAB="app/src/main/java/com/anamika/ai/TestLabActivity.java"
          AUDIT="tools/validate_audit.py"
          sed -i 's/OwnerSession\.isValid(/OwnerSession.isActive(/g' "$TEST_LAB"
          sed -i 's/OwnerSession\.isValid/OwnerSession.isActive/g' "$AUDIT"
          ! grep -R -Fq 'OwnerSession.isValid(' app/src/main/java
          grep -Fq 'OwnerSession.isActive(' "$TEST_LAB"
          grep -Fq 'OwnerSession.isActive' "$AUDIT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Recheck validators and actual compile
        run: |
          set -euo pipefail
          python3 tools/validate_source.py
          python3 tools/validate_v78.py
          python3 tools/validate_audit.py
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk

      - name: Commit source only
        run: |
          set -euo pipefail
          rm -rf app/build .gradle
          rm -f .github/workflows/build-apk.yml
          rm -rf anamika_build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tools build.gradle settings.gradle gradle.properties
          git add README.md CINEMATIC_ENGINE.md FULL_TOOLCHAIN_STATUS.md MODEL_BUILD.md PLUGIN_SYSTEM.md STANDALONE_ARCHITECTURE.md V7_6_ULTIMATE_FEATURES.md V7_8_2_FINAL_FOCUS.md V7_8_EVERGREEN_FEATURES.md VALIDATION_REPORT.txt 2>/dev/null || true
          git add -u anamika_build || true
          git status --short
          git commit -m "Add complete Anamika V7.8.2 direct Android source tree"
          git push origin HEAD:anamika-v7.8.2-final
