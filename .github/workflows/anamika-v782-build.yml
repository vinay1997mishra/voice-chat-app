name: Build Anamika V7.8.2 Direct Source

on:
  push:
    branches: [ anamika-v7.8.2-final ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/anamika-v782-build.yml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/38f6bab61d341b23a6c00226f32c0d6148bf9f43/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true
      MODEL_SHA256: cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046
      MODEL_PATH: app/src/main/assets/models/anamika-coder.gguf
      RELEASE_TAG: anamika-v7.8.2
      FINAL_NAME: AnamikaAI-V7.8.2-DirectSource-FINAL.apk
      OWNER_SIGNED_NAME: AnamikaAI-V7.8.2-OwnerSigned.apk

    steps:
      - uses: actions/checkout@v5

      - name: Set monotonic self-update version
        run: |
          set -euo pipefail
          echo "ANAMIKA_VERSION_CODE=$((7802000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANAMIKA_VERSION_NAME=7.8.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Prepare owner signing key when configured
        id: owner_signing
        env:
          KEYSTORE_B64: ${{ secrets.ANAMIKA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANAMIKA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANAMIKA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANAMIKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/anamika-owner.jks"
            test -s "$RUNNER_TEMP/anamika-owner.jks"
            echo "ANAMIKA_KEYSTORE_PATH=$RUNNER_TEMP/anamika-owner.jks" >> "$GITHUB_ENV"
            echo "ANAMIKA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANAMIKA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANAMIKA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Owner signing secrets are not configured; owner-signed self-update APK will be skipped."
          fi

      - name: Verify direct-source layout
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/anamika/ai/MainActivity.java
          test -f app/src/main/java/com/anamika/ai/SelfUpdateActivity.java
          test -f app/src/main/java/com/anamika/ai/TestLabActivity.java
          test -f app/src/main/kotlin/com/anamika/ai/KotlinLlamaRunner.kt
          test -f app/build.gradle
          test -f tools/validate_source.py
          test -f tools/validate_v78.py
          test -f tools/validate_audit.py
          test ! -e anamika_build/source.b64

      - name: Enforce critical Anamika invariants
        run: |
          set -euo pipefail
          ! grep -R -Fq 'OwnerSession.isValid(' app/src/main/java
          matches="$(grep -R -n -F 'PluginRegistry.setEnabled' app/src/main/java app/src/main/kotlin 2>/dev/null || true)"
          if [ -n "$matches" ] && echo "$matches" | grep -v 'PluginManagerActivity.java'; then
            echo "ERROR: non-PluginManager component can auto-enable plugins" >&2
            exit 1
          fi
          grep -Fq 'Hello Mika / Hello Anamika' app/src/main/res/layout/activity_main.xml
          grep -Fq 'android.permission.FOREGROUND_SERVICE_MICROPHONE' app/src/main/AndroidManifest.xml
          grep -Fq 'android:stopWithTask="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'OwnerSession.isTrusted' app/src/main/java/com/anamika/ai/BootWakeReceiver.java
          grep -Fq 'ALWAYS ON' app/src/main/res/layout/activity_main.xml
          grep -Fq 'CinematicMovieTimeline.sample' app/src/main/java/com/anamika/ai/media3d/Premium3DRenderer.java
          grep -Fq 'verifyAnimatedOutput' app/src/main/java/com/anamika/ai/media3d/Premium3DVideoExporter.java
          grep -Fq 'buildRepairPrompt' app/src/main/java/com/anamika/ai/StandaloneDeveloperEngine.java
          grep -Fq 'signing certificate does not match installed Anamika' app/src/main/java/com/anamika/ai/SelfUpdateActivity.java
          grep -Fq 'downloadLatestOwnerSigned' app/src/main/java/com/anamika/ai/SelfUpdateActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Bundle Microsoft TypeScript compiler
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/toolchains
          rm -rf "$RUNNER_TEMP/anamika-ts" && mkdir -p "$RUNNER_TEMP/anamika-ts"
          cd "$RUNNER_TEMP/anamika-ts"
          npm pack typescript@5.9.3 --silent
          tar -xzf typescript-5.9.3.tgz package/lib/typescript.js
          cp package/lib/typescript.js "$GITHUB_WORKSPACE/app/src/main/assets/toolchains/typescript.js"
          test -s "$GITHUB_WORKSPACE/app/src/main/assets/toolchains/typescript.js"
          test "$(stat -c%s "$GITHUB_WORKSPACE/app/src/main/assets/toolchains/typescript.js")" -gt 5000000
          sha256sum "$GITHUB_WORKSPACE/app/src/main/assets/toolchains/typescript.js" | tee "$GITHUB_WORKSPACE/app/src/main/assets/toolchains/typescript.sha256"

      - name: Validate direct source
        run: |
          set -euo pipefail
          python3 tools/validate_source.py
          python3 tools/validate_v78.py
          python3 tools/validate_audit.py

      - name: Build lite APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk

      - name: Preserve lite APK
        run: |
          mkdir -p artifacts/lite
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/lite/AnamikaAI-V7.8.2-DirectSource-Lite-debug.apk
          sha256sum artifacts/lite/*.apk > artifacts/LITE-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AnamikaAI-V7.8.2-direct-source-lite
          compression-level: 0
          path: |
            artifacts/lite/
            artifacts/LITE-SHA256SUMS.txt

      - name: Bundle verified local coding model
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          curl -L --fail --retry 4 --retry-delay 5 "$MODEL_URL" -o "$MODEL_PATH"
          test -s "$MODEL_PATH"
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
          test "$(stat -c%s "$MODEL_PATH")" -gt 900000000

      - name: Build full local-AI APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk

      - name: Preserve and verify full APK
        run: |
          set -euo pipefail
          mkdir -p artifacts/full
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/full/$FINAL_NAME"
          unzip -l "artifacts/full/$FINAL_NAME" | grep -F 'assets/models/anamika-coder.gguf'
          unzip -l "artifacts/full/$FINAL_NAME" | grep -F 'lib/arm64-v8a/libllama.so'
          unzip -l "artifacts/full/$FINAL_NAME" | grep -F 'lib/arm64-v8a/libllama_jni.so'
          unzip -l "artifacts/full/$FINAL_NAME" | grep -F 'lib/arm64-v8a/libpython3.13.so'
          unzip -l "artifacts/full/$FINAL_NAME" | grep -F 'lib/arm64-v8a/libchaquopy_java.so'
          unzip -l "artifacts/full/$FINAL_NAME" | grep -F 'assets/toolchains/typescript.js'
          unzip -l "artifacts/full/$FINAL_NAME" | grep -F 'classes' >/dev/null
          sha256sum artifacts/lite/*.apk artifacts/full/*.apk > artifacts/SHA256SUMS.txt

      - name: Build owner-signed self-update APK
        if: steps.owner_signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -tq app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "artifacts/full/$OWNER_SIGNED_NAME"
          sha256sum "artifacts/full/$OWNER_SIGNED_NAME" >> artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AnamikaAI-V7.8.2-direct-source-final
          compression-level: 0
          path: artifacts/

      - name: Publish debug/full APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          # GitHub's release upload endpoint can return transient 404/5xx errors for
          # very large APK assets. Keep the build artifact authoritative and retry
          # release publication without rebuilding the APK.
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "artifacts/full/$FINAL_NAME" --clobber; then
              exit 0
            fi
            echo "Release upload attempt $attempt failed."
            sleep $((attempt * 10))
          done
          echo "ERROR: APK is built and stored as an Actions artifact, but release publication failed after retries." >&2
          exit 1

      - name: Publish owner-signed self-update APK
        if: steps.owner_signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "artifacts/full/$OWNER_SIGNED_NAME" --clobber
