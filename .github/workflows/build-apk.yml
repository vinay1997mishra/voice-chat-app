name: Build Standalone Anamika APK

on:
  workflow_dispatch:
    inputs:
      bundle_local_model:
        description: 'Bundle offline coding model inside APK'
        required: true
        default: true
        type: boolean
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/38f6bab61d341b23a6c00226f32c0d6148bf9f43/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true
      MODEL_SHA256: cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046
      MODEL_PATH: app/src/main/assets/models/anamika-coder.gguf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bundle on-device coding model
        if: ${{ github.event_name == 'push' || inputs.bundle_local_model }}
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          curl -L --fail --retry 4 --retry-delay 5 "$MODEL_URL" -o "$MODEL_PATH"
          test -s "$MODEL_PATH"
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
          SIZE=$(stat -c%s "$MODEL_PATH")
          echo "Downloaded model bytes: $SIZE"
          if [ "$SIZE" -lt 900000000 ]; then
            echo "Model download looks incomplete" >&2
            exit 1
          fi

      - name: Validate source tree
        run: |
          python3 tools/validate_source.py
          python3 tools/validate_v78.py
          python3 tools/validate_audit.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK (unsigned)
        run: gradle --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AnamikaAI-V7.8.2-final-apks
          compression-level: 0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
