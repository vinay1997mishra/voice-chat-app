name: Tinni Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/tinni_worker/**'
      - 'apps/tinni_owner_panel/**'
      - '.github/workflows/tinni-worker-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tinni_worker/package-lock.json

      - name: Install Worker dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        run: npm ci

      - name: Deploy Worker and Owner Panel
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        run: npx wrangler deploy
