name: Tinni Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [tinnistar]
    paths:
      - 'apps/tinni_worker/**'
      - 'apps/tinni_owner_panel/**'
      - '.github/workflows/tinni-worker-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deploy blocked: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: apps/tinni_worker
        run: npm install --no-audit --no-fund

      - name: Verify backend before deployment
        working-directory: apps/tinni_worker
        run: npm test

      - name: Deploy Worker and Owner Panel
        working-directory: apps/tinni_worker
        run: npx wrangler deploy

      - name: Verify deployed Worker health
        shell: bash
        run: |
          set -euo pipefail
          base="https://tinni-star-api.mishrajii7991.workers.dev"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/health"
          echo
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 "$base/health/deep"
          echo
