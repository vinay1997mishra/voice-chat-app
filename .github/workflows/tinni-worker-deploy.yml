name: Tinni Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, build/tinni-star-0.5.23-41]
    paths:
      - 'apps/tinni_worker/**'
      - 'apps/tinni_owner_panel/**'
      - '.github/workflows/tinni-worker-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        run: npm install --no-audit --no-fund

      - name: Ensure premium effects R2 bucket
        id: r2
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        shell: bash
        run: |
          set +e
          npx wrangler r2 bucket create tinni-star-effects 2>&1 | tee /tmp/tinni-r2-create.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ] || grep -qi "already exists" /tmp/tinni-r2-create.log; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif grep -qi "enable R2" /tmp/tinni-r2-create.log; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "R2 is not enabled on this Cloudflare account; deploying Worker without the optional media binding."
          else
            exit "$status"
          fi

      - name: Upload premium effects manifest to R2
        if: steps.creds.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        run: |
          npx wrangler r2 object put tinni-star-effects/premium/manifest.json \
            --file assets/premium_effects_manifest.json \
            --content-type application/json

      - name: Deploy Worker and Owner Panel
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        shell: bash
        run: |
          if [ "${{ steps.r2.outputs.ready }}" = "true" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("wrangler.jsonc")
          data = json.loads(source.read_text())
          data["r2_buckets"] = [{
              "binding": "EFFECT_MEDIA",
              "bucket_name": "tinni-star-effects",
          }]
          Path("wrangler.r2.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
            npx wrangler deploy --config wrangler.r2.json
          else
            npx wrangler deploy
          fi
