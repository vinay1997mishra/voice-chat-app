name: Tinni Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, build/tinni-star-0.5.23-41]
    paths:
      - 'apps/tinni_worker/**'
      - 'apps/tinni_owner_panel/**'
      - '.github/workflows/tinni-worker-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deploy credentials
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        run: npm install --no-audit --no-fund

      - name: Ensure premium effects R2 bucket
        id: r2
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        shell: bash
        run: |
          set +e
          npx wrangler r2 bucket create tinni-star-effects 2>&1 | tee /tmp/tinni-r2-create.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ] || grep -qi "already exists" /tmp/tinni-r2-create.log; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif grep -qi "enable R2" /tmp/tinni-r2-create.log; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "R2 is not enabled on this Cloudflare account; deploying Worker without the optional media binding."
          else
            exit "$status"
          fi

      - name: Upload premium effects manifest to R2
        if: steps.creds.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        run: |
          npx wrangler r2 object put tinni-star-effects/premium/manifest.json \
            --file assets/premium_effects_manifest.json \
            --content-type application/json

      - name: Verify premium effects R2 object
        if: steps.creds.outputs.ready == 'true' && steps.r2.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        run: |
          rm -f /tmp/tinni-r2-manifest.json
          npx wrangler r2 object get tinni-star-effects/premium/manifest.json \
            --file /tmp/tinni-r2-manifest.json
          cmp assets/premium_effects_manifest.json /tmp/tinni-r2-manifest.json
          echo "R2 bucket and premium manifest verified."

      - name: Deploy Worker and Owner Panel
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/tinni_worker
        shell: bash
        run: |
          if [ "${{ steps.r2.outputs.ready }}" = "true" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("wrangler.jsonc")
          data = json.loads(source.read_text())
          data["r2_buckets"] = [{
              "binding": "EFFECT_MEDIA",
              "bucket_name": "tinni-star-effects",
          }]
          Path("wrangler.r2.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
            npx wrangler deploy --config wrangler.r2.json
          else
            npx wrangler deploy
          fi

      - name: Verify deployed service readiness
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          config="$(curl --retry 5 --retry-delay 2 --fail --silent --show-error \
            https://tinni-star-api.mishrajii7991.workers.dev/app-config)"
          CONFIG_JSON="$config" node - <<'NODE'
          const config = JSON.parse(process.env.CONFIG_JSON || "{}");
          const status = {
            r2_effect_media: config.effect_media_configured === true,
            livekit: config.livekit_configured === true,
            google_login: Boolean(config.google_server_client_id),
            email_otp: config.email_otp_configured === true,
            facebook: config.facebook_configured === true,
          };
          console.log("Tinni production readiness:", JSON.stringify(status));
          if (!status.r2_effect_media) {
            throw new Error("R2 EFFECT_MEDIA binding is not active after deploy");
          }
          NODE
