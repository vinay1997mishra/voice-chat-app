name: Publish Tinni cinematic catalog

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      apk_source_sha:
        description: Exact app source with the verified movie bundle pinned
        value: ${{ jobs.publish.outputs.apk_source_sha }}

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/tinnistar'
    runs-on: ubuntu-24.04
    outputs:
      apk_source_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cinematic-shard-*
          merge-multiple: true
          path: cinematic-preview
      - name: Install media verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - name: Verify every movie and package the complete catalog
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 tools/cinematic/catalog.py pack --source "$SOURCE_SHA"
      - name: Publish immutable movies and visual review sheets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          tag="cinematic-${SOURCE_SHA:0:12}"
          branch="cinematic-review-${SOURCE_SHA:0:12}"
          mkdir -p tools/cinematic/previews
          cp cinematic-package/reviews/*.jpg tools/cinematic/previews/
          cp cinematic-package/assets/manifest.json tools/cinematic/previews/manifest.json
          cp cinematic-package/cinematic-assets.sha256 tools/cinematic/previews/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/cinematic/previews
          if ! git diff --cached --quiet; then
            git commit -m "Verified cinematic catalog review sheets"
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin "HEAD:refs/heads/$branch"
            fi
          fi
          cat > /tmp/cinematic-notes.md <<'EOF'
          Complete original 3D movie catalog: 50 Normal, 20 CP, 249 Country gifts and ten nine-second stealth-black Rocket stages. Silent H.264/yuv420p, 360x640 at 24 fps; original animated mesh geometry, true waving flag textures, staged launches and attached boosters. Every movie is checked for duration, frame count, codec, dimensions and SHA-256. Contact sheets show all 329 posters.
          APK integration uses the pinned, verified bundle; this asset release is not itself an APK.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" cinematic-package/cinematic-assets.zip cinematic-package/cinematic-assets.sha256 cinematic-package/assets/manifest.json cinematic-package/reviews/*.jpg --target "$SOURCE_SHA" --prerelease --title "Tinni cinematic catalog ${SOURCE_SHA:0:12}" --notes-file /tmp/cinematic-notes.md
          fi
          echo "Cinematic bundle: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Pin verified bundle for the Android build
        id: pin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # The review commit belongs only on the review branch.
          git checkout --detach "$SOURCE_SHA"
          actual="$(git ls-remote origin refs/heads/tinnistar | cut -f1)"
          test "$actual" = "$SOURCE_SHA"
          python3 - "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          source = sys.argv[1]
          manifest = json.loads(Path("cinematic-package/assets/manifest.json").read_text())
          assert manifest["source_commit"] == source
          checksum = Path("cinematic-package/cinematic-assets.sha256").read_text().split()[0]
          lock = {
              "schema": 1, "source_commit": source,
              "release_tag": "cinematic-" + source[:12],
              "zip_sha256": checksum,
              "source_fingerprint": manifest["source_fingerprint"],
              "scene_count": manifest["scene_count"],
          }
          Path("tools/cinematic/bundle-lock.json").write_text(json.dumps(lock, indent=2) + "\n")
          spec = Path("apps/tinni_star/pubspec.yaml")
          text = spec.read_text()
          import re
          match = re.search(r"(?m)^version: (\d+)\.(\d+)\.(\d+)\+(\d+)$", text)
          assert match, "Unexpected APK version format"
          major, minor, patch, number = map(int, match.groups())
          version = f"version: {major}.{minor}.{patch+1}+{number+1}"
          spec.write_text(text[:match.start()] + version + text[match.end():])
          PY
          git add tools/cinematic/bundle-lock.json apps/tinni_star/pubspec.yaml
          git commit -m "Pin verified cinematic movie catalog for the Android APK"
          git push origin HEAD:refs/heads/tinnistar
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
