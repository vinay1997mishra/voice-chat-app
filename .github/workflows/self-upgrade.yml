name: Anamika Safe Self-Upgrade Gate

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: 'Upgrade proposal ID'
        required: true
        type: string
      owner_approved:
        description: 'Owner has reviewed the proposed diff'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-build:
    if: ${{ inputs.owner_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Create isolated Android build
        run: |
          flutter create --platforms=android --org com.voicechat.anamika --project-name voice_chat_app /tmp/anamika_upgrade
          rm -rf /tmp/anamika_upgrade/lib /tmp/anamika_upgrade/test
          cp -R apps/mobile/lib /tmp/anamika_upgrade/lib
          cp -R apps/mobile/test /tmp/anamika_upgrade/test
          cp apps/mobile/pubspec.yaml /tmp/anamika_upgrade/pubspec.yaml
      - name: Dependencies
        working-directory: /tmp/anamika_upgrade
        run: flutter pub get
      - name: Analyze
        working-directory: /tmp/anamika_upgrade
        run: flutter analyze --no-fatal-infos
      - name: Test self-upgrade safety gate
        working-directory: /tmp/anamika_upgrade
        run: flutter test test/self_upgrade_system_test.dart
      - name: Test app
        working-directory: /tmp/anamika_upgrade
        run: flutter test
      - name: Build APK
        working-directory: /tmp/anamika_upgrade
        run: flutter build apk --debug -t lib/main_v05.dart
      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -1d "$SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/anamika_upgrade/build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: anamika-upgrade-${{ inputs.proposal_id }}
          path: /tmp/anamika_upgrade/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
