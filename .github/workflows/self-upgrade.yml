name: Anamika Safe Self-Upgrade Gate
on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: 'Reviewed Anamika pull request number'
        required: true
        type: string
      approved_sha:
        description: 'Exact reviewed 40-character candidate commit SHA'
        required: true
        type: string
      owner_approved:
        description: 'I reviewed this exact diff and approve a candidate APK build'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  pull-requests: read
jobs:
  approve:
    if: ${{ inputs.owner_approved && github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.approve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: approve
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
        run: python3 tools/anamika/approve.py
  validate-build:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.approve.outputs.sha }}
          persist-credentials: false
          path: source
      - name: Build approved source in isolated container
        run: |
          mkdir apk-output
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=1024 --memory=10g \
            -v "$PWD/source/apps/mobile:/source:ro" -v "$PWD/apk-output:/output" \
            ghcr.io/cirruslabs/flutter:3.32.8 /bin/bash -lc '
              set -euo pipefail
              flutter create --platforms=android --org com.voicechat.anamika --project-name voice_chat_app /tmp/build
              rm -rf /tmp/build/lib /tmp/build/test
              cp -R /source/lib /tmp/build/lib
              cp -R /source/test /tmp/build/test
              cp /source/pubspec.yaml /tmp/build/pubspec.yaml
              cd /tmp/build
              flutter pub get
              flutter analyze --no-fatal-infos
              flutter test
              flutter build apk --debug -t lib/main_v05.dart --dart-define=ANAMIKA_OWNER_TOOLS=true
              cp build/app/outputs/flutter-apk/app-debug.apk /output/anamika-candidate.apk
            '
      - name: Verify candidate signature and record provenance
        env:
          APPROVED_SHA: ${{ needs.approve.outputs.sha }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -1d "$SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs apk-output/anamika-candidate.apk > apk-output/signature.txt
          sha256sum apk-output/anamika-candidate.apk > apk-output/sha256.txt
          printf 'Source SHA: %s\nProposal: %s\nDebug candidate; not a production signed update.\n' "$APPROVED_SHA" "$PROPOSAL_ID" > apk-output/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anamika-candidate-${{ needs.approve.outputs.sha }}
          path: apk-output/
          retention-days: 14
