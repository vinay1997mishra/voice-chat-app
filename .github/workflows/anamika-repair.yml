name: Anamika Repair Request
on:
  workflow_dispatch:
    inputs:
      request:
        description: 'Tell Anamika what to repair or add (Hindi or English)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: anamika-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check model configuration
        env:
          MODEL_URL: ${{ vars.ANAMIKA_MODEL_URL }}
          MODEL: ${{ vars.ANAMIKA_MODEL }}
          MODEL_KEY: ${{ secrets.ANAMIKA_MODEL_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os
          if not os.environ['MODEL_URL'].startswith('https://') or not os.environ['MODEL'] or not os.environ['MODEL_KEY']:
              raise SystemExit('Configure ANAMIKA_MODEL_URL and ANAMIKA_MODEL variables, plus ANAMIKA_MODEL_KEY secret. Never put a key in source or the APK.')
          PYCODE
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: |
          python3 tools/anamika/repair.py snapshot
          echo '{"passed": false, "log": "Implement owner request, then run real checks."}' > diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: repair-input
          path: |
            candidate.json
            diagnostics.json
          retention-days: 7
  attempt1:
    needs: prepare
    uses: ./.github/workflows/anamika-repair-attempt.yml
    with:
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      artifact: repair-input
      attempt: '1'
      request: ${{ inputs.request }}
    secrets:
      model_key: ${{ secrets.ANAMIKA_MODEL_KEY }}
  attempt2:
    needs: [prepare, attempt1]
    if: ${{ needs.attempt1.outputs.passed == 'false' }}
    uses: ./.github/workflows/anamika-repair-attempt.yml
    with:
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      artifact: repair-1
      attempt: '2'
      request: ${{ inputs.request }}
    secrets:
      model_key: ${{ secrets.ANAMIKA_MODEL_KEY }}
  attempt3:
    needs: [prepare, attempt2]
    if: ${{ needs.attempt2.outputs.passed == 'false' }}
    uses: ./.github/workflows/anamika-repair-attempt.yml
    with:
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      artifact: repair-2
      attempt: '3'
      request: ${{ inputs.request }}
    secrets:
      model_key: ${{ secrets.ANAMIKA_MODEL_KEY }}
  publish:
    needs: [prepare, attempt1, attempt2, attempt3]
    if: ${{ always() && (needs.attempt1.outputs.passed == 'true' || needs.attempt2.outputs.passed == 'true' || needs.attempt3.outputs.passed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.attempt1.outputs.passed == 'true' && 'repair-1' || needs.attempt2.outputs.passed == 'true' && 'repair-2' || 'repair-3' }}
          path: input
      - name: Publish reviewed candidate without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REQUEST: ${{ inputs.request }}
        run: python3 trusted/tools/anamika/repair.py publish --root source
  outcome:
    if: ${{ always() }}
    needs: [prepare, attempt1, attempt2, attempt3, publish]
    runs-on: ubuntu-latest
    steps:
      - env:
          PUBLISHED: ${{ needs.publish.result }}
        run: |
          if [ "$PUBLISHED" != success ]; then
            echo 'No upgrade published. Inspect configuration/model/check diagnostics; current app remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
