name: Publish Anamika V7.8.2 APK Release

on:
  push:
    branches: [ anamika-v7.8.2-final ]
    paths:
      - '.github/workflows/anamika-v782-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_ID: "10588127357"
      TAG_NAME: "anamika-v7.8.2"
      APK_NAME: "AnamikaAI-V7.8.2-FullLocalAI-debug.apk"

    steps:
      - uses: actions/checkout@v5

      - name: Download successful full APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          curl -L --fail             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             -o artifact.zip
          unzip -q artifact.zip -d release
          test -f "release/full/${APK_NAME}"
          test -f "release/SHA256SUMS.txt"
          sha256sum "release/full/${APK_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          gh release create "$TAG_NAME"             "release/full/$APK_NAME"             "release/SHA256SUMS.txt"             --target "${GITHUB_SHA}"             --title "Anamika AI V7.8.2 Full Local-AI"             --notes "Full Local-AI Android APK built successfully in GitHub Actions. Includes the bundled offline coding model. Debug-signed test build."
