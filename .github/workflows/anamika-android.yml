name: Anamika Android

on:
  push:
    branches:
      - anamika-ai-bootstrap
    tags:
      - 'anamika-v*'
    paths:
      - 'anamika-ai/**'
      - '.github/workflows/anamika-android.yml'
  pull_request:
    paths:
      - 'anamika-ai/**'
      - '.github/workflows/anamika-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anamika-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Android lint
        run: gradle lintDebug
      - name: Build installable debug APK
        run: gradle assembleDebug
      - name: Verify public release variant
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AnamikaAI-debug
          path: anamika-ai/app/build/outputs/apk/debug/app-debug.apk

  github-release:
    if: startsWith(github.ref, 'refs/tags/anamika-v')
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AnamikaAI-debug
          path: dist
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/app-debug.apk --clobber
