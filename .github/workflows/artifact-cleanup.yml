name: TinniStar Artifact Cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-cleanup.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: tinnistar-artifact-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest Tinnistar existing-package APK
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetBranch = "tinnistar";
            const preferredName = "Tinni-Star-ARM64";

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const active = artifacts
              .filter(a => !a.expired)
              .filter(a => a.workflow_run?.head_branch === targetBranch)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (active.length === 0) {
              core.info("No active Tinnistar artifacts found.");
              return;
            }

            const keepArtifact =
              active.find(a => a.name === preferredName) ?? active[0];

            core.info(
              `KEEP ${keepArtifact.id} ${keepArtifact.name} from run ${keepArtifact.workflow_run?.id}`
            );

            let deleted = 0;
            let freed = 0;
            for (const a of active) {
              if (a.id === keepArtifact.id) continue;
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: a.id,
              });
              deleted += 1;
              freed += Number(a.size_in_bytes || 0);
              core.info(`DELETE ${a.id} ${a.name}`);
            }

            core.info(
              `Deleted ${deleted} Tinnistar artifact(s), freed approximately ${freed} bytes. Latest existing-package APK preserved.`
            );
