name: Build Anamika 13 Clean

on:
  push:
    branches: [ anamika-v13-local-self-upgrade ]
    paths:
      - 'app13/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/anamika-v13-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"

      - name: Build clean V13 APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app13:assembleDebug
          test -f app13/build/outputs/apk/debug/app13-debug.apk
          unzip -tq app13/build/outputs/apk/debug/app13-debug.apk

      - name: APK size
        run: |
          du -h app13/build/outputs/apk/debug/app13-debug.apk
          stat -c%s app13/build/outputs/apk/debug/app13-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnamikaAI-13-clean-debug
          compression-level: 0
          path: app13/build/outputs/apk/debug/app13-debug.apk
