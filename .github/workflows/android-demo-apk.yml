name: Build Android Demo APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-demo-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create temporary Android runner project
        run: |
          flutter create --platforms=android --org com.voicechatdemo --project-name voice_chat_app /tmp/voice_chat_build
          rm -rf /tmp/voice_chat_build/lib /tmp/voice_chat_build/test
          cp -R apps/mobile/lib /tmp/voice_chat_build/lib
          cp -R apps/mobile/test /tmp/voice_chat_build/test
          cp apps/mobile/pubspec.yaml /tmp/voice_chat_build/pubspec.yaml

      - name: Get dependencies
        working-directory: /tmp/voice_chat_build
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/voice_chat_build
        run: flutter analyze

      - name: Test
        working-directory: /tmp/voice_chat_build
        run: flutter test

      - name: Build installable debug APK
        working-directory: /tmp/voice_chat_build
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-chat-demo-apk
          path: /tmp/voice_chat_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
