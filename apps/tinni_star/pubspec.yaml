name: tinni_star
description: Modular social voice-room app with Anamika connector and safe Function Pack runtime.
publish_to: 'none'
version: 0.5.27+45

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.2.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_commons: ^0.13.0
  file_picker: ^13.1.0
  google_sign_in: ^7.2.0
  country_picker: ^2.0.28
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  livekit_client: ^2.13.0
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  video_player: ^2.14.0
  mobile_scanner: ^7.4.2
  flutter_svga: ^0.0.13
  pag: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lucky_gifts/
